<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站点内容管理 - 股票分析与量化投资平台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#36CFC9',
                        accent: '#722ED1',
                        'neutral-dark': '#1D2129',
                        'neutral-medium': '#86909C',
                        'neutral-light': '#F2F3F5'
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .gradient-bg {
                background: linear-gradient(135deg, #165DFF 0%, #36CFC9 100%);
            }
            .sidebar-item {
                @apply flex items-center px-4 py-3 text-gray-700 hover:bg-primary/5 transition-all duration-300 cursor-pointer;
            }
            .sidebar-item-active {
                @apply bg-primary/10 text-primary border-r-4 border-primary;
            }
            .preview-hero {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
        }
    </style>
</head>
<body class="bg-neutral-50 font-inter text-neutral-dark min-h-screen flex flex-col">
    <!-- 统一导航栏 -->
    {% include 'components/header.html' %}

    <div class="flex flex-1 overflow-hidden">
        <!-- 左侧区域导航 -->
        <aside class="w-56 bg-white border-r border-gray-200 shadow-sm hidden md:block flex-shrink-0">
            <div class="p-5 gradient-bg text-white">
                <h2 class="text-lg font-bold">站点内容管理</h2>
                <p class="text-xs mt-1 opacity-80">编辑前端展示内容</p>
            </div>
            <nav class="mt-4" id="sectionNav">
                <a onclick="switchSection('hero')" class="sidebar-item sidebar-item-active" data-section="hero">
                    <i class="fa fa-home w-5 mr-3"></i>
                    <span>英雄区域 (Hero)</span>
                </a>
                <a onclick="switchSection('features')" class="sidebar-item" data-section="features">
                    <i class="fa fa-star w-5 mr-3"></i>
                    <span>核心功能 (Features)</span>
                </a>
                <a onclick="switchSection('announcement')" class="sidebar-item" data-section="announcement">
                    <i class="fa fa-bullhorn w-5 mr-3"></i>
                    <span>系统公告</span>
                </a>
                <a onclick="switchSection('about')" class="sidebar-item" data-section="about">
                    <i class="fa fa-info-circle w-5 mr-3"></i>
                    <span>关于我们 (About)</span>
                </a>
                <a onclick="switchSection('footer')" class="sidebar-item" data-section="footer">
                    <i class="fa fa-copyright w-5 mr-3"></i>
                    <span>页脚 (Footer)</span>
                </a>
            </nav>
        </aside>

        <!-- 移动端区域选择 -->
        <div class="md:hidden w-full p-4">
            <select id="mobileSectionSelect" onchange="switchSection(this.value)" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                <option value="hero">英雄区域 (Hero)</option>
                <option value="features">核心功能 (Features)</option>
                <option value="announcement">系统公告</option>
                <option value="about">关于我们 (About)</option>
                <option value="footer">页脚 (Footer)</option>
            </select>
        </div>

        <!-- 主内容区域：编辑 + 预览 -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6">
            <!-- 操作栏 -->
            <div class="flex flex-wrap items-center justify-between mb-6 gap-3">
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-neutral-dark" id="pageTitle">编辑内容 - 英雄区域</h1>
                    <p class="text-sm text-gray-500 mt-1">修改内容后点击保存即可生效，无需修改代码</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="saveAllChanges()" class="px-5 py-2.5 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all duration-300 shadow-md hover:shadow-lg transform hover:-translate-y-0.5 flex items-center gap-2">
                        <i class="fa fa-save"></i> 保存所有修改
                    </button>
                    <button onclick="resetToDefault()" class="px-5 py-2.5 border border-red-300 text-red-600 rounded-lg hover:bg-red-50 transition-all duration-300 flex items-center gap-2" title="恢复所有内容为系统默认值">
                        <i class="fa fa-refresh"></i> 恢复默认
                    </button>
                </div>
            </div>

            <!-- 状态消息 -->
            <div id="statusMessage" class="hidden mb-4 p-4 rounded-lg transition-all duration-300"></div>

            <!-- 编辑和预览双栏 -->
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                <!-- 左侧：编辑表单 -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                        <i class="fa fa-pencil text-primary"></i>
                        <span id="editSectionTitle">编辑内容</span>
                    </h3>
                    <div id="contentFields" class="space-y-5">
                        <div class="text-center text-gray-400 py-10">
                            <i class="fa fa-spinner fa-spin text-3xl mb-3"></i>
                            <p>加载中...</p>
                        </div>
                    </div>
                </div>

                <!-- 右侧：实时预览 -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                        <i class="fa fa-eye text-secondary"></i>
                        实时预览
                    </h3>
                    <div id="previewArea" class="border border-dashed border-gray-300 rounded-lg p-4 min-h-[300px] bg-gray-50 overflow-hidden">
                        <div class="text-center text-gray-400 py-10">
                            <p>选择左侧区域后可预览</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 存储所有内容数据
        let allContentData = {};
        let currentSection = 'hero';
        let modifiedFields = {};
        let isDirty = false;

        // 中文区域名映射
        const sectionNames = {
            'hero': '英雄区域',
            'features': '核心功能',
            'announcement': '系统公告',
            'about': '关于我们',
            'footer': '页脚'
        };

        // 字段中文标签映射
        const fieldLabels = {
            'title': '标题',
            'subtitle': '副标题',
            'description': '描述',
            'content': '内容',
            'about_text': '关于文本',
            'contact_email': '联系邮箱',
            'copyright': '版权信息',
            'button_text': '主按钮文字',
            'button_url': '主按钮链接',
            'secondary_text': '次按钮文字',
            'secondary_url': '次按钮链接',
            'card1_title': '卡片1 - 标题',
            'card1_desc': '卡片1 - 描述',
            'card1_icon': '卡片1 - 图标',
            'card2_title': '卡片2 - 标题',
            'card2_desc': '卡片2 - 描述',
            'card2_icon': '卡片2 - 图标',
            'card3_title': '卡片3 - 标题',
            'card3_desc': '卡片3 - 描述',
            'card3_icon': '卡片3 - 图标',
            'card4_title': '卡片4 - 标题',
            'card4_desc': '卡片4 - 描述',
            'card4_icon': '卡片4 - 图标',
            'is_active': '是否激活'
        };

        // 页面加载时获取所有内容
        document.addEventListener('DOMContentLoaded', function() {
            loadAllContent();
            // 监听页面离开前提示
            window.addEventListener('beforeunload', function(e) {
                if (isDirty) {
                    e.preventDefault();
                    e.returnValue = '您有未保存的修改，确定要离开吗？';
                    return e.returnValue;
                }
            });
        });

        function loadAllContent() {
            fetch('/api/admin/content')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        allContentData = data.data;
                        renderCurrentSection();
                    } else {
                        showMessage(data.message, 'error');
                    }
                })
                .catch(err => {
                    showMessage('加载内容失败: ' + err.message, 'error');
                });
        }

        function switchSection(section) {
            currentSection = section;
            // 更新侧边栏高亮
            document.querySelectorAll('#sectionNav .sidebar-item').forEach(item => {
                item.classList.remove('sidebar-item-active');
                if (item.getAttribute('data-section') === section) {
                    item.classList.add('sidebar-item-active');
                }
            });
            // 更新移动端选择
            const mobileSelect = document.getElementById('mobileSectionSelect');
            if (mobileSelect) mobileSelect.value = section;
            // 更新页面标题
            document.getElementById('pageTitle').textContent = '编辑内容 - ' + (sectionNames[section] || section);
            document.getElementById('editSectionTitle').textContent = '编辑 ' + (sectionNames[section] || section);
            // 重新渲染
            modifiedFields = {};
            isDirty = false;
            renderCurrentSection();
        }

        function renderCurrentSection() {
            const items = allContentData[currentSection] || [];
            const fieldsContainer = document.getElementById('contentFields');
            const previewContainer = document.getElementById('previewArea');

            if (items.length === 0) {
                fieldsContainer.innerHTML = `
                    <div class="text-center text-gray-400 py-10">
                        <i class="fa fa-inbox text-3xl mb-3"></i>
                        <p>该区域暂无内容项</p>
                    </div>`;
                previewContainer.innerHTML = `
                    <div class="text-center text-gray-400 py-10">
                        <p>该区域暂无内容可预览</p>
                    </div>`;
                return;
            }

            // 渲染编辑表单
            let fieldsHtml = '';
            items.forEach(item => {
                const label = fieldLabels[item.key] || item.key;
                const fieldId = `field_${item.section}_${item.key}`;
                const isTextArea = item.content.length > 60 || item.content.includes('\n');
                const isUrl = item.content_type === 'url' || item.key.includes('_url');

                fieldsHtml += `
                <div class="bg-gray-50 rounded-lg p-4 border border-gray-100 hover:border-primary/30 transition-colors">
                    <div class="flex items-center justify-between mb-2">
                        <label class="text-sm font-semibold text-gray-700" for="${fieldId}">
                            ${label}
                            <span class="text-xs text-gray-400 ml-2">(${item.key})</span>
                        </label>
                        <span class="text-xs px-2 py-0.5 rounded ${item.content_type === 'url' ? 'bg-blue-100 text-blue-700' : item.content_type === 'html' ? 'bg-purple-100 text-purple-700' : 'bg-gray-200 text-gray-600'}">${item.content_type.toUpperCase()}</span>
                    </div>
                    ${isTextArea ? 
                        `<textarea id="${fieldId}" 
                            data-section="${item.section}" 
                            data-key="${item.key}" 
                            rows="3"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 text-sm"
                            oninput="onFieldChange(this)">${escapeHtml(item.content)}</textarea>` :
                        `<input type="text" id="${fieldId}" 
                            data-section="${item.section}" 
                            data-key="${item.key}" 
                            value="${escapeHtml(item.content)}"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 text-sm"
                            oninput="onFieldChange(this)">`
                    }
                </div>`;
            });
            fieldsContainer.innerHTML = fieldsHtml;

            // 渲染预览
            renderPreview(currentSection, items);
        }

        function onFieldChange(el) {
            const section = el.getAttribute('data-section');
            const key = el.getAttribute('data-key');
            modifiedFields[`${section}/${key}`] = el.value;
            isDirty = true;
            // 实时更新预览
            debounceUpdatePreview(section);
        }

        // 防抖更新预览
        let previewTimer = null;
        function debounceUpdatePreview(section) {
            if (previewTimer) clearTimeout(previewTimer);
            previewTimer = setTimeout(() => {
                const items = allContentData[section] || [];
                const mergedItems = items.map(item => {
                    const modKey = `${item.section}/${item.key}`;
                    return {
                        ...item,
                        content: modifiedFields[modKey] !== undefined ? modifiedFields[modKey] : item.content
                    };
                });
                renderPreview(section, mergedItems);
            }, 300);
        }

        function renderPreview(section, items) {
            const container = document.getElementById('previewArea');
            const getContent = (key, def) => {
                const item = items.find(i => i.key === key);
                return item ? item.content : def;
            };

            let html = '';

            switch (section) {
                case 'hero':
                    const heroTitle = getContent('title', '标题').replace(/\n/g, '<br>');
                    html = `
                    <div class="preview-hero rounded-xl p-8 text-white text-center">
                        <h2 class="text-3xl font-bold mb-3" style="white-space: pre-line;">${escapeHtml(heroTitle)}</h2>
                        <p class="text-white/80 mb-6">${escapeHtml(getContent('subtitle', ''))}</p>
                        <div class="flex justify-center gap-3">
                            <span class="inline-block px-6 py-2 bg-white text-purple-700 rounded-lg font-semibold">${escapeHtml(getContent('button_text', '按钮'))}</span>
                            ${getContent('secondary_text', '') ? `<span class="inline-block px-6 py-2 border border-white/50 text-white rounded-lg">${escapeHtml(getContent('secondary_text', ''))}</span>` : ''}
                        </div>
                    </div>`;
                    break;

                case 'features':
                    const cards = [];
                    for (let i = 1; i <= 4; i++) {
                        const title = getContent(`card${i}_title`, '');
                        const desc = getContent(`card${i}_desc`, '');
                        const icon = getContent(`card${i}_icon`, 'fa-star');
                        if (title || desc) {
                            cards.push({ title, desc, icon });
                        }
                    }
                    html = `
                    <div class="text-center mb-4">
                        <h3 class="text-xl font-bold">${escapeHtml(getContent('title', '核心功能'))}</h3>
                        <p class="text-sm text-gray-500 mt-1">${escapeHtml(getContent('subtitle', ''))}</p>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        ${cards.map(c => `
                            <div class="bg-white rounded-lg p-3 shadow-sm border border-gray-100">
                                <i class="fa ${escapeHtml(c.icon)} text-primary text-lg mb-1"></i>
                                <h4 class="font-semibold text-sm">${escapeHtml(c.title)}</h4>
                                <p class="text-xs text-gray-500 mt-1">${escapeHtml(c.desc)}</p>
                            </div>
                        `).join('')}
                    </div>`;
                    break;

                case 'announcement':
                    const isActive = getContent('is_active', 'true').toLowerCase() === 'true';
                    html = `
                    <div class="${isActive ? 'bg-blue-50 border border-blue-200' : 'bg-gray-100 border border-gray-200'} rounded-lg p-4">
                        <div class="flex items-center gap-2 mb-2">
                            <i class="fa fa-bullhorn ${isActive ? 'text-blue-500' : 'text-gray-400'}"></i>
                            <h4 class="font-semibold ${isActive ? 'text-blue-700' : 'text-gray-500'}">${escapeHtml(getContent('title', '公告'))}</h4>
                            ${!isActive ? '<span class="text-xs bg-gray-300 text-gray-600 px-2 py-0.5 rounded">已停用</span>' : ''}
                        </div>
                        <p class="text-sm ${isActive ? 'text-blue-600' : 'text-gray-400'}">${escapeHtml(getContent('content', ''))}</p>
                    </div>`;
                    break;

                case 'about':
                    html = `
                    <div class="text-center">
                        <h3 class="text-xl font-bold mb-2">${escapeHtml(getContent('title', '关于我们'))}</h3>
                        <p class="text-sm text-primary font-medium mb-3">${escapeHtml(getContent('subtitle', ''))}</p>
                        <p class="text-sm text-gray-600 leading-relaxed max-w-lg mx-auto">${escapeHtml(getContent('description', ''))}</p>
                    </div>`;
                    break;

                case 'footer':
                    html = `
                    <div class="text-center text-sm text-gray-600">
                        <p class="mb-2">${escapeHtml(getContent('about_text', ''))}</p>
                        <p class="mb-1"><i class="fa fa-envelope mr-1 text-gray-400"></i>${escapeHtml(getContent('contact_email', ''))}</p>
                        <p class="text-xs text-gray-400 mt-3">${escapeHtml(getContent('copyright', ''))}</p>
                    </div>`;
                    break;

                default:
                    html = `<p class="text-gray-400 text-center">暂不支持预览此区域</p>`;
            }

            container.innerHTML = html;
        }

        function saveAllChanges() {
            if (Object.keys(modifiedFields).length === 0) {
                showMessage('没有需要保存的修改', 'info');
                return;
            }

            const updates = [];
            for (const [key, value] of Object.entries(modifiedFields)) {
                const [section, ...keyParts] = key.split('/');
                updates.push({
                    section: section,
                    key: keyParts.join('/'),
                    content: value
                });
            }

            const saveBtn = document.querySelector('button[onclick="saveAllChanges()"]');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 保存中...';

            fetch('/api/admin/content', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updates)
            })
            .then(res => res.json())
            .then(data => {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa fa-save"></i> 保存所有修改';
                if (data.success) {
                    showMessage(data.message || '保存成功', 'success');
                    modifiedFields = {};
                    isDirty = false;
                    // 重新加载数据以保持同步
                    loadAllContent();
                } else {
                    showMessage(data.message || '保存失败', 'error');
                }
            })
            .catch(err => {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa fa-save"></i> 保存所有修改';
                showMessage('保存失败: ' + err.message, 'error');
            });
        }

        function resetToDefault() {
            if (!confirm('确定要恢复所有内容为系统默认值吗？\n\n此操作将删除所有自定义内容并恢复为出厂设置。')) {
                return;
            }

            fetch('/api/admin/content/reset', {
                method: 'POST'
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage(data.message, 'success');
                    modifiedFields = {};
                    isDirty = false;
                    loadAllContent();
                } else {
                    showMessage(data.message || '重置失败', 'error');
                }
            })
            .catch(err => {
                showMessage('重置失败: ' + err.message, 'error');
            });
        }

        function showMessage(msg, type) {
            const el = document.getElementById('statusMessage');
            el.classList.remove('hidden');
            el.textContent = msg;
            if (type === 'success') {
                el.className = 'mb-4 p-4 rounded-lg bg-green-100 text-green-700 transition-all duration-300';
            } else if (type === 'error') {
                el.className = 'mb-4 p-4 rounded-lg bg-red-100 text-red-700 transition-all duration-300';
            } else {
                el.className = 'mb-4 p-4 rounded-lg bg-blue-100 text-blue-700 transition-all duration-300';
            }
            // 自动隐藏
            setTimeout(() => { el.classList.add('hidden'); }, 5000);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>

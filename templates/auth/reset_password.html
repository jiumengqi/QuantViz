{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center">设置新密码</h3>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                        
                        <div class="form-group">
                            <label for="password">新密码</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                            <small class="form-text text-muted">密码长度至少为8位，包含大小写字母和数字</small>
                        </div>
                        <div class="form-group">
                            <label for="confirm_password">确认新密码</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block mt-4">重置密码</button>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <a href="{{ url_for('auth.login') }}">返回登录</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

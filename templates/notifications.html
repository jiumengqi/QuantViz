<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知中心 - 股票分析与量化投资平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#36CFC9',
                        accent: '#722ED1',
                        'neutral-dark': '#1D2129',
                        'neutral-medium': '#86909C',
                        'neutral-light': '#F2F3F5'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-neutral-light min-h-screen">
    {% include 'components/header.html' %}

    <div class="container mx-auto px-4 pt-24 pb-12">
        <!-- 页面标题 -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-neutral-dark mb-2">
                <i class="fa fa-bell-o mr-2 text-primary"></i>通知中心
            </h1>
            <p class="text-neutral-medium">查看和管理您的所有通知</p>
        </div>

        <!-- 操作栏 -->
        <div class="bg-white rounded-lg shadow-sm p-4 mb-6 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-4">
                <label class="flex items-center cursor-pointer">
                    <input type="checkbox" id="unread-only" class="w-4 h-4 text-primary rounded border-gray-300 focus:ring-primary">
                    <span class="ml-2 text-neutral-dark">仅显示未读</span>
                </label>
            </div>
            <div class="flex items-center space-x-2">
                <button id="mark-all-read" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all duration-300 text-sm">
                    <i class="fa fa-check mr-1"></i>全部标为已读
                </button>
                <button id="delete-read" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-all duration-300 text-sm">
                    <i class="fa fa-trash mr-1"></i>删除已读
                </button>
            </div>
        </div>

        <!-- 未读计数提示 -->
        <div id="unread-banner" class="hidden bg-primary/10 border border-primary/30 rounded-lg p-4 mb-6 flex items-center justify-between">
            <div class="flex items-center">
                <i class="fa fa-bell text-primary text-xl mr-3"></i>
                <span class="text-neutral-dark">您有 <span id="unread-count" class="font-bold text-primary">0</span> 条未读通知</span>
            </div>
            <button id="close-banner" class="text-neutral-medium hover:text-neutral-dark">
                <i class="fa fa-times"></i>
            </button>
        </div>

        <!-- 通知列表 -->
        <div id="notification-list" class="space-y-4">
            <!-- 通知加载中 -->
            <div id="loading" class="bg-white rounded-lg shadow-sm p-8 text-center">
                <i class="fa fa-spinner fa-spin text-3xl text-primary mb-3"></i>
                <p class="text-neutral-medium">正在加载通知...</p>
            </div>
        </div>

        <!-- 空状态 -->
        <div id="empty-state" class="hidden bg-white rounded-lg shadow-sm p-12 text-center">
            <i class="fa fa-bell-slash text-6xl text-neutral-light mb-4"></i>
            <h3 class="text-xl font-medium text-neutral-dark mb-2">暂无通知</h3>
            <p class="text-neutral-medium">您将在此收到系统通知、交易提醒和策略信号</p>
        </div>

        <!-- 分页 -->
        <div id="pagination" class="hidden mt-6 flex justify-center">
            <div class="flex items-center space-x-2">
                <button id="prev-page" class="px-4 py-2 bg-white rounded-lg shadow-sm border border-gray-200 text-neutral-dark hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa fa-chevron-left mr-1"></i>上一页
                </button>
                <span id="page-info" class="px-4 py-2 text-neutral-medium">第 1 页</span>
                <button id="next-page" class="px-4 py-2 bg-white rounded-lg shadow-sm border border-gray-200 text-neutral-dark hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    下一页<i class="fa fa-chevron-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>

    {% include 'components/footer.html' %}

    <script>
        // 全局变量
        let currentPage = 1;
        let perPage = 20;
        let totalNotifications = 0;
        let currentUnreadCount = 0;

        // DOM元素
        const notificationList = document.getElementById('notification-list');
        const loading = document.getElementById('loading');
        const emptyState = document.getElementById('empty-state');
        const pagination = document.getElementById('pagination');
        const unreadBanner = document.getElementById('unread-banner');
        const unreadCount = document.getElementById('unread-count');
        const unreadOnlyCheckbox = document.getElementById('unread-only');

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadNotifications();
            updateUnreadCount();
            setupEventListeners();
        });

        // 设置事件监听
        function setupEventListeners() {
            // 标记全部已读
            document.getElementById('mark-all-read').addEventListener('click', markAllAsRead);

            // 删除已读
            document.getElementById('delete-read').addEventListener('click', deleteAllRead);

            // 关闭未读提示
            document.getElementById('close-banner').addEventListener('click', function() {
                unreadBanner.classList.add('hidden');
            });

            // 仅显示未读
            unreadOnlyCheckbox.addEventListener('change', function() {
                currentPage = 1;
                loadNotifications();
            });

            // 分页
            document.getElementById('prev-page').addEventListener('click', function() {
                if (currentPage > 1) {
                    currentPage--;
                    loadNotifications();
                }
            });

            document.getElementById('next-page').addEventListener('click', function() {
                const totalPages = Math.ceil(totalNotifications / perPage);
                if (currentPage < totalPages) {
                    currentPage++;
                    loadNotifications();
                }
            });
        }

        // 加载通知列表
        async function loadNotifications() {
            showLoading();

            const unreadOnly = unreadOnlyCheckbox.checked;
            const url = `/api/notifications?page=${currentPage}&per_page=${perPage}&unread_only=${unreadOnly}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.success) {
                    totalNotifications = data.total;
                    renderNotifications(data.notifications);
                    updatePagination();
                } else {
                    showError('加载通知失败');
                }
            } catch (error) {
                console.error('Error loading notifications:', error);
                showError('网络错误，请稍后重试');
            }
        }

        // 渲染通知列表
        function renderNotifications(notifications) {
            hideLoading();

            if (notifications.length === 0) {
                notificationList.innerHTML = '';
                emptyState.classList.remove('hidden');
                pagination.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            notificationList.innerHTML = notifications.map(notification => `
                <div class="bg-white rounded-lg shadow-sm p-4 notification-item ${notification.is_read ? '' : 'border-l-4 border-primary'}" data-id="${notification.id}">
                    <div class="flex items-start justify-between">
                        <div class="flex items-start space-x-4">
                            <div class="notification-icon w-10 h-10 rounded-full flex items-center justify-center ${getNotificationIconClass(notification.type)}">
                                <i class="${getNotificationIcon(notification.type)}"></i>
                            </div>
                            <div class="flex-1">
                                <div class="flex items-center space-x-2 mb-1">
                                    <h3 class="font-medium text-neutral-dark ${notification.is_read ? '' : 'font-semibold'}">${escapeHtml(notification.title)}</h3>
                                    <span class="px-2 py-0.5 text-xs rounded-full ${getNotificationBadgeClass(notification.type)}">${getNotificationTypeName(notification.type)}</span>
                                    ${notification.is_read ? '' : '<span class="px-2 py-0.5 text-xs rounded-full bg-primary/10 text-primary">未读</span>'}
                                </div>
                                <p class="text-neutral-medium text-sm mb-2">${escapeHtml(notification.content)}</p>
                                <p class="text-neutral-medium text-xs">
                                    <i class="fa fa-clock-o mr-1"></i>${notification.created_at}
                                </p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            ${notification.is_read ? '' : `
                            <button class="mark-read-btn px-3 py-1 text-sm text-primary hover:bg-primary/10 rounded-lg transition-all duration-300" title="标记已读">
                                <i class="fa fa-check"></i>
                            </button>
                            `}
                            <button class="delete-btn px-3 py-1 text-sm text-red-500 hover:bg-red-500/10 rounded-lg transition-all duration-300" title="删除">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            // 绑定事件
            notificationList.querySelectorAll('.mark-read-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.closest('.notification-item').dataset.id;
                    markAsRead(id);
                });
            });

            notificationList.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.closest('.notification-item').dataset.id;
                    deleteNotification(id);
                });
            });
        }

        // 获取通知图标
        function getNotificationIcon(type) {
            switch (type) {
                case 'trade':
                    return 'fa fa-exchange';
                case 'strategy':
                    return 'fa fa-line-chart';
                case 'system':
                default:
                    return 'fa fa-cog';
            }
        }

        // 获取通知图标样式
        function getNotificationIconClass(type) {
            switch (type) {
                case 'trade':
                    return 'bg-green-100 text-green-600';
                case 'strategy':
                    return 'bg-purple-100 text-purple-600';
                case 'system':
                default:
                    return 'bg-blue-100 text-blue-600';
            }
        }

        // 获取通知类型名称
        function getNotificationTypeName(type) {
            switch (type) {
                case 'trade':
                    return '交易';
                case 'strategy':
                    return '策略';
                case 'system':
                default:
                    return '系统';
            }
        }

        // 获取通知徽章样式
        function getNotificationBadgeClass(type) {
            switch (type) {
                case 'trade':
                    return 'bg-green-100 text-green-700';
                case 'strategy':
                    return 'bg-purple-100 text-purple-700';
                case 'system':
                default:
                    return 'bg-blue-100 text-blue-700';
            }
        }

        // 更新未读计数
        async function updateUnreadCount() {
            try {
                const response = await fetch('/api/notifications/unread-count');
                const data = await response.json();

                if (data.success) {
                    currentUnreadCount = data.unread_count;
                    unreadCount.textContent = currentUnreadCount;

                    if (currentUnreadCount > 0) {
                        unreadBanner.classList.remove('hidden');
                    } else {
                        unreadBanner.classList.add('hidden');
                    }

                    // 更新导航栏的未读计数
                    updateNavbarUnreadCount(currentUnreadCount);
                }
            } catch (error) {
                console.error('Error updating unread count:', error);
            }
        }

        // 更新导航栏未读计数
        function updateNavbarUnreadCount(count) {
            let badge = document.getElementById('notification-badge');
            if (!badge && count > 0) {
                const notificationLink = document.querySelector('a[href*="notifications"]');
                if (notificationLink) {
                    badge = document.createElement('span');
                    badge.id = 'notification-badge';
                    badge.className = 'absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center';
                    badge.textContent = count > 99 ? '99+' : count;
                    notificationLink.style.position = 'relative';
                    notificationLink.appendChild(badge);
                }
            } else if (badge) {
                if (count > 0) {
                    badge.textContent = count > 99 ? '99+' : count;
                } else {
                    badge.remove();
                }
            }
        }

        // 标记单条已读
        async function markAsRead(id) {
            try {
                const response = await fetch(`/api/notifications/read/${id}`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    loadNotifications();
                    updateUnreadCount();
                } else {
                    showError(data.message);
                }
            } catch (error) {
                console.error('Error marking as read:', error);
                showError('网络错误，请稍后重试');
            }
        }

        // 标记全部已读
        async function markAllAsRead() {
            try {
                const response = await fetch('/api/notifications/read/all', {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    loadNotifications();
                    updateUnreadCount();
                } else {
                    showError(data.message);
                }
            } catch (error) {
                console.error('Error marking all as read:', error);
                showError('网络错误，请稍后重试');
            }
        }

        // 删除单条通知
        async function deleteNotification(id) {
            if (!confirm('确定要删除这条通知吗？')) {
                return;
            }

            try {
                const response = await fetch(`/api/notifications/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (data.success) {
                    loadNotifications();
                    updateUnreadCount();
                } else {
                    showError(data.message);
                }
            } catch (error) {
                console.error('Error deleting notification:', error);
                showError('网络错误，请稍后重试');
            }
        }

        // 删除所有已读通知
        async function deleteAllRead() {
            if (!confirm('确定要删除所有已读通知吗？')) {
                return;
            }

            try {
                const response = await fetch('/api/notifications/read/delete-all', {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (data.success) {
                    loadNotifications();
                    updateUnreadCount();
                } else {
                    showError(data.message);
                }
            } catch (error) {
                console.error('Error deleting all read:', error);
                showError('网络错误，请稍后重试');
            }
        }

        // 更新分页信息
        function updatePagination() {
            const totalPages = Math.ceil(totalNotifications / perPage);
            const pageInfo = document.getElementById('page-info');
            const prevBtn = document.getElementById('prev-page');
            const nextBtn = document.getElementById('next-page');

            if (totalPages <= 1) {
                pagination.classList.add('hidden');
                return;
            }

            pagination.classList.remove('hidden');
            pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页`;
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
        }

        // 显示加载中
        function showLoading() {
            loading.classList.remove('hidden');
            emptyState.classList.add('hidden');
            notificationList.innerHTML = '';
        }

        // 隐藏加载中
        function hideLoading() {
            loading.classList.add('hidden');
        }

        // 显示错误
        function showError(message) {
            notificationList.innerHTML = `
                <div class="bg-red-50 border border-red-200 rounded-lg p-4 text-red-700">
                    <i class="fa fa-exclamation-circle mr-2"></i>${escapeHtml(message)}
                </div>
            `;
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>

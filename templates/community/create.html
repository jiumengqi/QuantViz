<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布策略 - 量化投资平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ed 100%);
            min-height: 100vh;
        }
        .code-editor {
            background: #2d2d2d;
            color: #f8f8f2;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
        }
        .form-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body>
    {% include 'components/header.html' %}
    
    <div class="container mx-auto px-4 pt-24 pb-12">
        <!-- 返回链接 -->
        <a href="{{ url_for('community.community_index') }}" class="inline-flex items-center text-blue-500 hover:text-blue-700 mb-6 transition-colors duration-300">
            <i class="fa fa-arrow-left mr-2"></i>返回社区
        </a>

        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-xl shadow-md p-8">
                <h1 class="text-2xl font-bold text-gray-800 mb-6">
                    <i class="fa fa-share-alt mr-2 text-blue-500"></i>发布策略
                </h1>

                <form id="strategyForm">
                    <!-- 策略名称 -->
                    <div class="mb-6">
                        <label class="block text-gray-700 font-medium mb-2">
                            <i class="fa fa-tag mr-1 text-blue-500"></i>策略名称 <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="strategyName" required
                            class="form-input w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none transition-all duration-300"
                            placeholder="给你的策略起个名字，如：双均线交叉策略">
                    </div>

                    <!-- 策略描述 -->
                    <div class="mb-6">
                        <label class="block text-gray-700 font-medium mb-2">
                            <i class="fa fa-align-left mr-1 text-blue-500"></i>策略描述
                        </label>
                        <textarea id="strategyDesc" rows="4"
                            class="form-input w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none transition-all duration-300 resize-none"
                            placeholder="简要描述你的策略逻辑、使用场景、预期效果等"></textarea>
                    </div>

                    <!-- 策略代码 -->
                    <div class="mb-6">
                        <label class="block text-gray-700 font-medium mb-2">
                            <i class="fa fa-code mr-1 text-blue-500"></i>策略代码 <span class="text-red-500">*</span>
                        </label>
                        <div class="text-sm text-gray-500 mb-2">支持Python代码，请确保代码完整可运行</div>
                        <textarea id="strategyCode" required
                            class="code-editor w-full px-4 py-4 border border-gray-200 rounded-lg focus:outline-none resize-none"
                            rows="20"
                            placeholder="# 在此粘贴你的Python策略代码&#10;import pandas as pd&#10;import numpy as np&#10;&#10;def your_strategy(data):&#10;    # 策略逻辑&#10;    pass"></textarea>
                    </div>

                    <!-- 策略参数 -->
                    <div class="mb-6">
                        <label class="block text-gray-700 font-medium mb-2">
                            <i class="fa fa-sliders mr-1 text-blue-500"></i>策略参数 (JSON格式)
                        </label>
                        <textarea id="strategyParams" rows="4"
                            class="form-input w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none transition-all duration-300 resize-none font-mono text-sm"
                            placeholder='{"short_window": 10, "long_window": 30}'>{}</textarea>
                        <p class="text-xs text-gray-400 mt-1">以JSON格式定义策略参数，如：{"param1": value1, "param2": value2}</p>
                    </div>

                    <!-- 提示信息 -->
                    <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 rounded-r-lg">
                        <div class="flex">
                            <i class="fa fa-info-circle text-blue-500 mt-0.5 mr-3"></i>
                            <div class="text-sm text-blue-700">
                                <p class="font-medium mb-1">分享规则：</p>
                                <ul class="list-disc list-inside space-y-1">
                                    <li>请确保分享的代码为原创或已获得授权</li>
                                    <li>策略代码将公开发布，请勿包含敏感信息</li>
                                    <li>平台不对策略的实际收益作出任何承诺</li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- 提交按钮 -->
                    <div class="flex items-center justify-end space-x-4">
                        <button type="button" onclick="location.href='{{ url_for('community.community_index') }}'"
                            class="px-6 py-3 border border-gray-300 text-gray-600 rounded-lg hover:bg-gray-50 transition-all duration-300">
                            取消
                        </button>
                        <button type="submit"
                            class="px-8 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-all duration-300 shadow-lg hover:shadow-xl">
                            <i class="fa fa-send mr-2"></i>发布策略
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    {% include 'components/footer.html' %}

    <script>
        document.getElementById('strategyForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const strategyName = document.getElementById('strategyName').value.trim();
            const strategyCode = document.getElementById('strategyCode').value.trim();
            const strategyDesc = document.getElementById('strategyDesc').value.trim();
            const strategyParams = document.getElementById('strategyParams').value.trim() || '{}';

            // 验证
            if (!strategyName) {
                alert('请输入策略名称');
                return;
            }
            if (!strategyCode) {
                alert('请输入策略代码');
                return;
            }

            // 验证JSON格式
            try {
                if (strategyParams !== '{}') {
                    JSON.parse(strategyParams);
                }
            } catch (e) {
                alert('策略参数JSON格式不正确');
                return;
            }

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>发布中...';

            try {
                const response = await fetch('/api/community/strategies', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        strategy_name: strategyName,
                        strategy_code: strategyCode,
                        description: strategyDesc,
                        parameters: strategyParams
                    })
                });

                const data = await response.json();

                if (data.success) {
                    alert('发布成功！');
                    location.href = `/community/strategies/${data.strategy.id}`;
                } else {
                    alert(data.message || '发布失败');
                }
            } catch (error) {
                console.error('发布失败:', error);
                alert('发布失败，请稍后重试');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa fa-send mr-2"></i>发布策略';
            }
        });
    </script>
</body>
</html>
